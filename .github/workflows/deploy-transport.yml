name: Deploy (transport → VPS)

# Rust 实时传输网关镜像构建（独立 workflow：paths 过滤 apps/transport-server/**，
# 改 Nest 代码不会触发 Rust 全量编译 —— 几分钟 vs 白跑）。
# 与 deploy.yml 相同流程：推 main → 构建 → GHCR → VPS 拉镜像。
on:
  push:
    branches: [main]
    paths:
      - 'apps/transport-server/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'packages/shared-types/fixtures/**' # 协议夹具变更 = 协议变更
      - '.github/workflows/deploy-transport.yml'
  workflow_dispatch:

concurrency:
  group: deploy-transport-production
  cancel-in-progress: false # 部署不可并行，排队执行

permissions:
  contents: read
  packages: write # GITHUB_TOKEN 推 GHCR 需要

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/pigeon-transport

jobs:
  build-push:
    name: 构建并推送镜像到 GHCR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 构建并推送镜像（cargo-chef 分层缓存）
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/transport-server/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: VPS 拉取镜像并更新 transport 容器
    runs-on: ubuntu-latest
    needs: build-push
    steps:
      - name: SSH 部署（更新代码 → 拉镜像 → 起容器 → 健康检查）
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.PIGEON_SSH_HOST }}
          username: ${{ secrets.PIGEON_SSH_USER }}
          key: ${{ secrets.PIGEON_SSH_KEY }}
          command_timeout: 30m
          script_stop: true
          script: |
            export IMAGE_TAG=${{ github.sha }}
            cd /opt/pigeon/repo

            git fetch --force origin
            git checkout --force ${{ github.sha }}

            echo "── 拉取 transport 镜像（增量层）──"
            docker compose -f deploy/docker-compose.yml pull transport

            echo "── 更新 transport 容器（优雅关闭：going_away 广播 → ≤10s 退出）──"
            docker compose -f deploy/docker-compose.yml up -d transport

            echo "── 健康检查（internal /healthz，容器网内）──"
            for i in $(seq 1 15); do
              if docker exec pigeon-transport /usr/local/bin/transport-server --selfcheck; then
                echo "transport 部署成功"
                exit 0
              fi
              sleep 2
            done
            echo "健康检查失败，查看日志：docker logs pigeon-transport"
            exit 1
