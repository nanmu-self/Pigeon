name: Deploy (server → VPS)

# 流程：推 main → Actions 构建镜像推 GHCR → SSH 到 VPS 拉镜像/迁移/起容器 → 健康检查
# VPS 不做任何构建（2G 内存友好），前置条件见 deploy/README.md
on:
  push:
    branches: [main]
    paths:
      - 'apps/server/**'
      - 'packages/shared-types/**'
      - 'pnpm-lock.yaml'
      - 'deploy/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false # 部署不可并行，排队执行

permissions:
  contents: read
  packages: write # GITHUB_TOKEN 推 GHCR 需要

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/pigeon-server

jobs:
  build-push:
    name: 构建并推送镜像到 GHCR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 构建并推送运行镜像（runtime）
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/server/Dockerfile
          target: runtime
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 构建并推送迁移镜像（build 阶段，含 prisma CLI）
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/server/Dockerfile
          target: build
          push: true
          tags: ${{ env.IMAGE }}:build-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: VPS 拉取镜像并更新服务
    runs-on: ubuntu-latest
    needs: build-push
    steps:
      - name: SSH 部署（更新代码 → 拉镜像 → 迁移 → 起容器 → 健康检查）
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.PIGEON_SSH_HOST }}
          username: ${{ secrets.PIGEON_SSH_USER }}
          key: ${{ secrets.PIGEON_SSH_KEY }}
          command_timeout: 30m
          script_stop: true # 任一步骤失败立即中断
          script: |
            export IMAGE_TAG=${{ github.sha }}
            cd /opt/pigeon/repo

            # 更新 VPS 上的 compose 文件（部署定义跟着代码走）
            git fetch --force origin
            git checkout --force ${{ github.sha }}

            echo "── 拉取镜像（增量层）──"
            docker compose -f deploy/docker-compose.yml pull

            echo "── 数据库迁移（一次性容器）──"
            docker compose -f deploy/docker-compose.yml --profile tools run --rm migrate

            echo "── 更新服务容器 ──"
            docker compose -f deploy/docker-compose.yml up -d server

            echo "── 健康检查 ──"
            for i in $(seq 1 30); do
              if curl -fsS http://127.0.0.1:3048/health > /dev/null 2>&1; then
                echo "部署成功：$(curl -fsS http://127.0.0.1:3048/health)"
                exit 0
              fi
              sleep 2
            done
            echo "健康检查失败（60s 内 /health 未就绪），查看日志：docker logs pigeon-server"
            exit 1
