name: CI (server)

on:
  push:
    branches: [main]
  pull_request:

jobs:
  server:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: pigeon
          POSTGRES_PASSWORD: pigeon
          POSTGRES_DB: pigeon
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pigeon"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # e2e 会连真实 Postgres 建用户/发消息（dotenv 不会覆盖已有环境变量）
      DATABASE_URL: postgresql://pigeon:pigeon@localhost:5432/pigeon
      JWT_SECRET: ci-only-secret
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm --filter @pigeon/server lint

      - name: 应用数据库 schema
        run: pnpm --filter @pigeon/server db:update

      - name: 单元测试
        run: pnpm --filter @pigeon/server test

      - name: E2E 测试
        run: pnpm --filter @pigeon/server test:e2e

      - name: 构建验证
        run: pnpm --filter @pigeon/server build
