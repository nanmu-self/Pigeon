[package]
name = "pigeon-desktop-tauri"
version = "0.1.0"
description = "Pigeon Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# tray-icon：系统托盘（窗口收起后的恢复入口）
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 本地聊天记录持久化（bundled: 自带 SQLite 源码编译，免系统依赖）
rusqlite = { version = "0.37", features = ["bundled"] }

[target."cfg(windows)".dependencies]
# WebView2 版本门槛的原生错误弹窗（MessageBoxW），仅 Windows 目标编译
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }

