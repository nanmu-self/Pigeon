# Pigeon 后端（NestJS）— 在 VPS 上由 GitHub Actions 驱动，1Panel 只负责看容器/反代
#
# 常用命令（VPS 上）：
#   数据库迁移（一次性任务容器）：docker compose -f deploy/docker-compose.yml --profile tools run --rm migrate
#   启动/更新服务：              docker compose -f deploy/docker-compose.yml up -d --build server
#   看日志：                     docker logs -f pigeon-server
#
# 网络说明：加入 1Panel 的应用网络后，DATABASE_URL 的主机名直接写
# Postgres 的容器名（1Panel「容器」页里看，形如 1Panel-postgres-xxxx），
# 无需把 5432 端口映射出来。
services:
  # 一次性迁移任务：复用 build 阶段镜像（含 prisma CLI 与迁移文件）
  migrate:
    profiles: ["tools"] # 不随 up 启动，仅 --profile tools run 时执行
    build:
      context: ..
      dockerfile: apps/server/Dockerfile
      target: build
    command: pnpm --filter @pigeon/server db:update
    env_file: /opt/pigeon/shared/env
    networks: [pigeon]

  server:
    build:
      context: ..
      dockerfile: apps/server/Dockerfile
      target: runtime
    container_name: pigeon-server
    env_file: /opt/pigeon/shared/env
    # 只绑本机回环：外网流量一律走 1Panel 的 OpenResty 反代 + HTTPS
    ports:
      - "127.0.0.1:3048:3048"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3048/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks: [pigeon]

networks:
  pigeon:
    # 1Panel 应用容器所在的网络（docker network ls 确认名字，通常叫 1panel-network）
    name: 1panel-network
    external: true
